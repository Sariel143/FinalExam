<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard SIA</title>
    <style>
        /* Reset default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #444;
            background-color: #000;
            overflow: hidden; /* Hide any overflowing content */
        }

        /* Rain effect */
        #rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Light transparent background */
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            z-index: 1;
        }

        h2 {
            font-size: 28px;
            color: #6a1b9a;
            margin-bottom: 20px;
            font-weight: 600;
        }

        p {
            font-size: 18px;
            margin: 15px 0;
            color: #333;
            font-weight: 500;
        }

        strong {
            color: #b86b8a;
        }

        .actions {
            margin-top: 25px;
            border-top: 2px solid #ddd;
            padding-top: 15px;
        }

        ul {
            list-style-type: none;
            margin-top: 20px;
            padding: 0;
        }

        ul li {
            margin: 15px 0;
        }

        ul li a {
            text-decoration: none;
            color: #6a1b9a;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        ul li a:hover {
            color: #b86b8a;
            text-decoration: underline;
            transform: scale(1.05);
        }

        .actions a {
            border-radius: 5px;
            padding: 10px 20px;
            background-color: #6a1b9a;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .actions a:hover {
            background-color: #b86b8a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Rain Effect Canvas -->
    <canvas id="rain"></canvas>

    <div class="container">
        <h2>Welcome to Your Dashboard</h2>

        <!-- Display email only -->
        <p><strong>Email:</strong> <span id="email">FoodHitchDelivery@gmail.com</span></p>

        <!-- Links to other sections of the app -->
        <div class="actions">
            <ul>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </div>
    </div>

    <script>
        // Rain effect setup
        const canvas = document.getElementById('rain');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Raindrop class
        class Raindrop {
            constructor(x, y, length, speed) {
                this.x = x;
                this.y = y;
                this.length = length;
                this.speed = speed;
            }

            // Draw the raindrop
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Update the raindrop's position
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
                this.draw();
            }
        }

        // Create raindrops
        const raindrops = [];
        for (let i = 0; i < 100; i++) {
            raindrops.push(new Raindrop(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 20 + 10, Math.random() * 3 + 2));
        }

        // Animate rain
        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            raindrops.forEach(raindrop => raindrop.update());
            requestAnimationFrame(animateRain);
        }

        animateRain();
    </script>

    <script type="module" src="userdashboard.js"></script>
</body>
</html>
