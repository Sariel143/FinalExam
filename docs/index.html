<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard SIA</title>
    <style>
        /* Reset default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0b5e0, #b4f0e0);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #444;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        h2 {
            font-size: 28px;
            color: #6a1b9a;
            margin-bottom: 20px;
            font-weight: 600;
        }

        p {
            font-size: 18px;
            margin: 15px 0;
            color: #333;
            font-weight: 500;
        }

        strong {
            color: #b86b8a;
        }

        .actions {
            margin-top: 25px;
            border-top: 2px solid #ddd;
            padding-top: 15px;
        }

        ul {
            list-style-type: none;
            margin-top: 20px;
            padding: 0;
        }

        ul li {
            margin: 15px 0;
        }

        ul li a {
            text-decoration: none;
            color: #6a1b9a;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        ul li a:hover {
            color: #b86b8a;
            text-decoration: underline;
            transform: scale(1.05);
        }

        .actions a {
            border-radius: 5px;
            padding: 10px 20px;
            background-color: #6a1b9a;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .actions a:hover {
            background-color: #b86b8a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to Your Dashboard</h2>

        <!-- Display email only -->
        <p><strong>Email:</strong> <span id="email">SIA2finals@gmail.com</span></p>

        <!-- Links to other sections of the app -->
        <div class="actions">
            <ul>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </div>
    </div>

    <!-- Firebase Authentication and Session Management -->
    <script type="module" src="userdashboard.js"></script>
</body>
</html>
