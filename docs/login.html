<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        /* Reset default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            background-color: #000; /* Set a base color for the background */
            overflow: hidden; /* Hide anything overflowing */
        }

        /* Rain effect */
        #rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: pink;
            width: 350px;
            padding: 20px 30px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            z-index: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: brown;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: brown;
        }

        input::placeholder {
            color: peachpuff;
            font-style: italic;
            opacity: 1;
        }

        input[type="text"], input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            color: brown;
        }

        input:focus {
            border-color: beige;
        }

        button {
            padding: 10px;
            background: burlywood;
            color: brown;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: cornsilk;
        }

        p {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        p a {
            text-decoration: none;
            color: brown;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Rain Effect Canvas -->
    <canvas id="rain"></canvas>

    <div class="container">
        <h2>Login Form</h2>
        <form id="loginForm">
            <label for="email">Email/Phone:</label>
            <input type="text" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script>
        // Rain effect setup
        const canvas = document.getElementById('rain');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Raindrop class
        class Raindrop {
            constructor(x, y, length, speed) {
                this.x = x;
                this.y = y;
                this.length = length;
                this.speed = speed;
            }

            // Draw the raindrop
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Update the raindrop's position
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = -this.length;
                    this.x = Math.random() * canvas.width;
                }
                this.draw();
            }
        }

        // Create raindrops
        const raindrops = [];
        for (let i = 0; i < 100; i++) {
            raindrops.push(new Raindrop(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 20 + 10, Math.random() * 3 + 2));
        }

        // Animate rain
        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            raindrops.forEach(raindrop => raindrop.update());
            requestAnimationFrame(animateRain);
        }

        animateRain();
    </script>

    <script type="module" src="login.js"></script>
</body>
</html>
